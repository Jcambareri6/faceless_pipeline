name: Telegram Listener

# Corre cada 10 minutos: lee updates de Telegram (botones apretados,
# respuestas de texto), avanza la maquina de estados de los drafts, y
# persiste todo (incluida la media generada) en el repo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: faceless_pipeline/requirements.txt

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: pip install -r faceless_pipeline/requirements.txt

      - name: Procesar updates de Telegram
        working-directory: faceless_pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python telegram_listener.py

      - name: Commit y push de drafts/ y telegram_offset.json
        working-directory: faceless_pipeline
        run: |
          git config user.name "faceless-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts/ telegram_offset.json || true
          if git diff --staged --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "telegram-listener: actualiza drafts y offset"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
