name: Competitor Research

# Corre 1 vez por semana (lunes 10:00 UTC): investiga shorts recientes de
# la competencia por canal y actualiza competitor_insights_*.json, que
# generate_metadata.py reusa mientras tenga menos de 7 dias.
on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: [money_curiosities, history_geopolitics]
      max-parallel: 1
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: faceless_pipeline/requirements.txt

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: pip install -r faceless_pipeline/requirements.txt

      - name: Investigar competencia (${{ matrix.channel }})
        working-directory: faceless_pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python competitor_research.py --channel ${{ matrix.channel }}

      - name: Commit y push de competitor_insights
        working-directory: faceless_pipeline
        run: |
          git config user.name "faceless-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add competitor_insights_*.json || true
          if git diff --staged --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "competitor-research: actualiza insights (${{ matrix.channel }})"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
