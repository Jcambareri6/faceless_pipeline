name: Topic Scan

# Corre 2 veces al dia: 12:00 y 20:00 UTC. Estos horarios son fijos todo
# el anio (el cron de GitHub Actions no ajusta por horario de verano), asi
# que la hora local real va a variar +-1h segun el DST de tu zona horaria.
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: [money_curiosities, history_geopolitics]
      # Serializado a proposito: si los 2 canales corrieran en paralelo,
      # los dos intentarian hacer git push casi al mismo tiempo.
      max-parallel: 1
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: faceless_pipeline/requirements.txt

      - name: Instalar dependencias
        run: pip install -r faceless_pipeline/requirements.txt

      - name: Escanear temas y generar guiones (${{ matrix.channel }})
        working-directory: faceless_pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orchestrator.py --channel ${{ matrix.channel }}

      - name: Commit y push de drafts/ y topics_seen
        working-directory: faceless_pipeline
        run: |
          git config user.name "faceless-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts/ topics_seen_*.json || true
          if git diff --staged --quiet; then
            echo "Sin cambios para commitear."
          else
            git commit -m "topic-scan: nuevos guiones (${{ matrix.channel }})"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
